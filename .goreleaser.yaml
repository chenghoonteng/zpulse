# GoReleaser configuration for zpulse.
# https://goreleaser.com
#
# zpulse shells out to `zpool` and `zfs`, so it is only useful on platforms with
# ZFS. We build for Linux only.
version: 2

project_name: zpulse

builds:
  - id: zpulse
    main: .
    binary: zpulse
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w

archives:
  - id: zpulse
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}.deb"
    files:
      - README.md
      - LICENSE*

nfpms:
  - id: zpulse
    package_name: zpulse
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_linux_{{ .Arch }}"
    vendor: chenghoonteng
    homepage: https://github.com/chenghoonteng/zpulse
    maintainer: chenghoonteng <cheng@baidu.com>
    description: |-
      Read-only command-line monitor for ZFS pools.
      Shows pool health, capacity and fragmentation, datasets, and running
      scrubs. Shells out to zpool and zfs with read-only commands.
    license: MIT
    section: admin
    formats:
      - deb
    bindir: /usr/bin
    contents:
      - src: ./README.md
        dst: /usr/share/doc/zpulse/README.md
      - src: ./LICENSE
        dst: /usr/share/doc/zpulse/LICENSE

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
