# GoReleaser configuration for zpulse.
# https://goreleaser.com
#
# zpulse shells out to `zpool` and `zfs`, so it is only useful on platforms with
# ZFS. We build for Linux only.
#
# Released binaries are built with `-tags ebpf`, so per-process I/O attribution
# is included. That tag pulls in github.com/cilium/ebpf, which is pure Go, so
# the build stays CGO-free and the binary stays static. The BPF object it
# embeds (zfsio_bpfel.o) is committed, so no C toolchain is needed here either.
# The feature still does nothing without CAP_BPF/CAP_PERFMON at runtime; it
# reports why and the rest of zpulse carries on.
version: 2

project_name: zpulse

builds:
  - id: zpulse
    main: .
    binary: zpulse
    env:
      - CGO_ENABLED=0
    tags:
      - ebpf
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w

archives:
  - id: zpulse
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*

nfpms:
  - id: zpulse
    package_name: zpulse
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_linux_{{ .Arch }}"
    vendor: chenghoonteng
    homepage: https://github.com/chenghoonteng/zpulse
    maintainer: chenghoonteng <cheng@baidu.com>
    description: |-
      Read-only command-line monitor for ZFS pools.
      Shows pool health, capacity and fragmentation, datasets, running scrubs,
      and per-process I/O. Shells out to zpool and zfs with read-only commands;
      per-process attribution uses eBPF and needs CAP_BPF and CAP_PERFMON.
    license: MIT
    section: admin
    formats:
      - deb
    bindir: /usr/bin
    # setcap lives here on Debian and Ubuntu. The postinstall script degrades
    # gracefully without it, but the package ships a binary whose headline
    # feature needs it, so it is a hard dependency rather than a suggestion.
    dependencies:
      - libcap2-bin
    scripts:
      postinstall: ./packaging/postinstall.sh
    contents:
      - src: ./README.md
        dst: /usr/share/doc/zpulse/README.md
      - src: ./LICENSE
        dst: /usr/share/doc/zpulse/LICENSE

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
